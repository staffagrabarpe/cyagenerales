server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Detrás del proxy de Dokploy (Traefik, que maneja HTTPS): redirecciones
    # relativas, para que nginx no genere "http://" ni el puerto interno.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # URLs limpias: redirige los enlaces antiguos con .html (301, para SEO)
    #   /index.html     -> /
    #   /nosotros.html  -> /nosotros
    # Se evalúa sobre $request_uri (la URL original) para no crear bucles.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) {
        return 301 /$1$is_args$args;
    }

    # Nota: add_header dentro de un location reemplaza los del server,
    # por eso los encabezados de seguridad se repiten en cada bloque.

    # Inicio: sirve index.html directamente (sin redirección interna)
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # /nosotros -> nosotros.html
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
